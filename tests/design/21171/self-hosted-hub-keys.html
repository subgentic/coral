<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Self-hosted Hub keys — Settings mock</title><style>
*{box-sizing:border-box}body{margin:0;background:#14171b;color:#edf0f4;font:15px/1.5 system-ui;--panel:#20252c;--line:#414b58;--muted:#afb9c5;--input:#181c22;--blue:#96cbff}body.light{background:#f2f4f7;color:#202832;--panel:#fff;--line:#ccd2db;--muted:#566170;--input:#f7f8fa;--blue:#075da9}button,input,select{font:inherit}button,select{min-height:44px;padding:9px 15px;border:1px solid var(--line);border-radius:7px;background:var(--panel);color:inherit;cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--blue);outline-offset:2px}.primary{background:#2674bc;color:white;border-color:#2674bc}button:disabled{opacity:.55;cursor:default}header{padding:16px 24px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;flex-wrap:wrap}header strong{margin-right:auto}main{max-width:940px;margin:28px auto;padding:0 24px 50px}nav{color:var(--muted);margin-bottom:22px}h1{font-size:26px;margin:0 0 20px}h2{font-size:21px;margin:0 0 8px}h3{font-size:17px;margin:0 0 8px}p{margin:8px 0 16px}.muted,small,dt{color:var(--muted)}section{padding:24px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:18px 0}.actions small{margin-right:auto}.row{border-top:1px solid var(--line);padding:18px 0;display:flex;gap:18px;align-items:center}.row>div{flex:1;min-width:0}.row p{margin:3px 0 0;color:var(--muted);font-size:13px}details{margin-top:20px;border-top:1px solid var(--line);padding-top:16px}summary{cursor:pointer;min-height:44px;color:var(--blue);font-weight:600}code{font:13px/1.6 ui-monospace,monospace;overflow-wrap:anywhere}pre{white-space:pre-wrap;background:var(--input);padding:14px;border-radius:6px}label{display:block;font-weight:600;margin:18px 0}input{display:block;width:100%;max-width:460px;margin-top:7px;padding:12px;border:1px solid var(--line);border-radius:6px;background:var(--input);color:inherit}ol{padding-left:22px}li{padding:4px 0}.note{padding:14px;background:var(--input);border-radius:7px}.badge{font-size:12px;color:var(--muted);font-weight:400}.success{color:var(--blue)}@media(max-width:600px){header{padding:12px}main{padding:0 16px 32px;margin-top:20px}section{padding:18px}h1{font-size:23px}.row{align-items:flex-start;gap:8px}.row p span{display:block}.actions{align-items:stretch}.actions small{width:100%}}
</style><header><strong>Design review · Settings / self-hosted Hub keys</strong><button id="theme">Light theme</button><select id="state" aria-label="Preview state"><option value="list">Live keys</option><option value="empty">No keys</option><option value="create">Create key</option><option value="secret">Key shown once</option><option value="cap">8-key limit</option><option value="revoke">Revoke confirmation</option><option value="hub">Viewed through a Hub</option></select></header><main><nav>Settings › Network › Coral Hub</nav><h1>Coral Hub and remote access</h1><section id="card"></section><p class="muted"><small>Interactive mock · example data only · no network requests or real keys.</small></p></main><script>
const card=document.querySelector('#card'),state=document.querySelector('#state');const intro='<h2>Keys for a self-hosted Hub</h2><p>Create a separate key for each Hub you run. A key lets that Hub request a connection to this computer. You still choose its access and approve the connection here.</p>';const guide='<details open><summary>Connect your self-hosted Hub</summary><ol><li>In your Hub, open <b>Add computer</b>.</li><li>For an <b>SSH connection</b>, the Hub can run <code>coral cloud keys create &quot;My Hub&quot;</code> on this computer as the user running Coral. Or create a key here and paste it into Add computer.</li><li>For an <b>HTTP connection</b>, create a key here. Enter this computer’s address and paste the key into your Hub’s Add computer.</li><li>Review the Hub’s request in this computer’s Inbox, choose its access, and enter the connection code back in the Hub.</li></ol><p class="muted">These keys request Hub connections. They are separate from this computer’s general API key. Keep each key in the Hub it was made for; keys work until you revoke them.</p></details>';
function render(){let s=state.value;card.innerHTML=intro;if(s==='hub'){card.innerHTML+='<p class="note">Manage self-hosted Hub keys at the computer: open its dashboard, then Settings → Network → Coral Hub → Keys for a self-hosted Hub.</p>';return}if(s==='create'){card.innerHTML+='<h3>Create key</h3><label>Hub name <span class="badge">Required · 40 characters max</span><input id="name" maxlength="40" placeholder="e.g. Home Hub" required></label><p class="muted">Use a unique name so you can recognize and revoke this Hub’s key later. Keys have no expiry.</p><div class="actions"><button class="primary" data-next="secret">Create key</button><button data-next="list">Cancel</button></div>';return}if(s==='secret'){card.innerHTML+='<p class="success">Key created for Home Hub</p><h3>Copy this key now</h3><p>You cannot view it again after closing this panel.</p><pre><code id="secret">lrk_example_NOT_A_REAL_KEY</code></pre><button id="copy">Copy key</button><p id="status" role="status"></p><ol><li>Return to your self-hosted Hub’s <b>Add computer</b>.</li><li>Paste this key into its key field.</li><li>Approve its connection request in this computer’s Inbox, then enter the connection code in the Hub.</li></ol><div class="actions"><button class="primary" data-next="list">Done</button><button data-next="revoke">Revoke this key</button></div>';return}if(s==='revoke'){card.innerHTML+='<h3>Revoke Home Hub’s key?</h3><p>It can no longer request a connection. Any connection request it left waiting will end. Existing Hub connections stay connected.</p><div class="actions"><button class="primary" data-next="empty">Revoke key</button><button data-next="list">Cancel</button></div>';return}let count=s==='empty'?0:s==='cap'?8:2;card.innerHTML+='<div class="actions"><small>'+count+' of 8 live keys · reusable until revoked</small><button class="primary" data-next="create" '+(count===8?'disabled':'')+'>Create key</button></div>';if(!count)card.innerHTML+='<p class="note">No keys yet. Create one for your first self-hosted Hub.</p>';if(count===8)card.innerHTML+='<p class="note">You have 8 live keys. Revoke one before creating another.</p>';for(let i=0;i<count;i++)card.innerHTML+='<div class="row"><div><b>'+(['Home Hub','Work Hub'][i]||'Hub '+(i+1))+'</b><p><span>Created Nov 24, 2026</span><span> · Last used '+(i?'Never':'today at 09:20')+'</span></p></div><button data-next="revoke">Revoke</button></div>';card.innerHTML+=guide}
state.onchange=render;document.querySelector('#theme').onclick=()=>{document.body.classList.toggle('light');document.querySelector('#theme').textContent=document.body.classList.contains('light')?'Dark theme':'Light theme'};card.onclick=e=>{if(e.target.dataset.next){if(e.target.dataset.next==='secret'&&!document.querySelector('#name')?.value.trim()){document.querySelector('#name')?.reportValidity();return}state.value=e.target.dataset.next;render()}if(e.target.id==='copy'){navigator.clipboard?.writeText('lrk_example_NOT_A_REAL_KEY').then(()=>document.querySelector('#status').textContent='Copied example key.',()=>document.querySelector('#status').textContent='Select and copy the example key above.')}};render();
</script></html>
