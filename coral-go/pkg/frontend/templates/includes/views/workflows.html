{{ define "includes/views/workflows.html" }}
<!-- Workflows View -->
<div id="workflows-view" class="workflows-view" style="display:none">
    <p id="wf-status" class="sr-only" role="status" aria-live="polite"></p><!-- said when a run starts (#7471) -->
    <div class="wf-page" id="wf-page">
        <!-- Workflow Detail (single workflow) -->
        <div id="wf-detail-container" class="wf-detail-container" style="display:none">
            <div id="wf-detail"></div>
        </div>

        <!-- Run Detail -->
        <div id="wf-run-detail-container" class="wf-run-detail-container" style="display:none">
            <div id="wf-run-detail"></div>
        </div>
    </div>
</div>

<!-- Create/Edit Workflow Modal -->
<div id="wf-create-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="wf-modal-title" style="display:none" data-on-click="wf-modal-backdrop">
    <div class="modal-content dlg-flow">
        <div class="modal-header">
            <h3 id="wf-modal-title">New workflow</h3>
        </div>
        <div class="modal-body" id="wf-form"></div>
        <div class="modal-actions modal-footer" id="wf-footer"></div>
    </div>
</div>

{{ end }}
