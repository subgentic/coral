{{ define "includes/views/docs.html" }}
<!-- Documentation View -->
<div id="docs-view" class="docs-view" style="display:none">
    <!-- On a phone the sidebar's pane is the page's list, here (mobile.js), and the document is the screen after it (#7443) -->
    <div id="mobile-docs-list"></div>
    <div class="docs-page" id="docs-page">
        <div class="docs-toolbar">
            <button type="button" id="docs-back" class="back-link" data-on-click="sgroup-open" data-kind="docs" data-group="" hidden></button>
            <button type="button" id="docs-phone-back" class="back-link docs-phone-back" data-on-click="docs-phone-back">&larr; Docs</button>
            <button type="button" class="btn btn-small" id="docs-copy-agent-line" data-on-click="docs-copy-agent-line" title="Copies one line you can paste to an agent so it can read these docs">
                <span class="material-icons" aria-hidden="true">content_copy</span> Copy docs line for agents
            </button>
        </div>
        <p class="docs-toolbar-hint">Paste it to an agent: it reads these docs with <code>coral-agent docs</code>.</p>
        <p id="docs-status" class="sr-only" role="status" aria-live="polite"></p>
        <article class="docs-content prose prose-doc" id="docs-content"></article>
    </div>
</div>

{{ end }}
