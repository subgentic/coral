{{ define "includes/views/inbox.html" }}
<!-- Inbox tab (#4718, #4811, #7472). Where the hub serves the dashboard it is the hub's /inbox page in a frame, made by inbox_tab.js the first time the tab is shown (so no page carries an empty one), full width. On every other Coral the dashboard builds its own, on the shared sidebar: three groups (Needs you, Tasks, Saved) whose names open a table in the centre (inbox_sidebar.js); a task or a saved message opens as a page of its own here. -->
<div id="inbox-view" class="inbox-view" role="region" aria-label="Inbox" style="display:none">
    <!-- On a phone the sidebar's pane is the page's list, here (mobile.js), and a task or a message is the screen after it -->
    <div id="mobile-inbox-list"></div>
    <div id="inbox-local" class="inbox-local" hidden>
        <div id="inbox-live" class="inbox-live" role="status" aria-live="polite" aria-atomic="true"></div>
        <div id="inbox-page" class="inbox-page" hidden></div>
        <div id="inbox-tasks-host" class="inbox-tasks-host" hidden></div><!-- the one mounted Inbox component (inbox_coral.js): the "Read the whole message" control of a saved message comes from it -->
    </div>
</div>
{{ end }}
